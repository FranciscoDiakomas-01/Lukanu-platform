version: '3.9'

services:
  api:
    container_name: api-name
    build: .
    restart : always
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      - pg
      - redis
    
  pg:
    image: postgres:16
    container_name: pg
    restart : always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blogdb
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis :
    image: redis:7-alpine
    container_name: redis
    restart : always
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - redisdata:/data
    
volumes:
  pgdata
  redisdata

networks:
  backend
